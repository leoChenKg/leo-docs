<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#172033" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .muted { fill: #667085; }
      .ink { fill: #182230; }
      .blue { fill: #0b72e7; }
    </style>
  </defs>
  <rect width="1440" height="760" fill="#fbfcfe"/>
  <rect x="72" y="54" width="1296" height="652" rx="20" fill="#ffffff" stroke="#e6eaf0" filter="url(#shadow)"/>
  <text x="128" y="112" class="sans muted" font-size="18" font-weight="500">前端工程　/　基础语法与运行时</text>
  <text x="128" y="205" class="sans ink" font-size="68" font-weight="760">闭包：让函数记住状态</text>
  <text x="128" y="267" class="sans muted" font-size="25" font-weight="400">闭包是 JavaScript 中一个非常重要且常见的概念。通过闭包，函数可以“记住”并访问其创建时的词法作用域。</text>
  <line x1="128" y1="318" x2="1312" y2="318" stroke="#edf0f4" stroke-width="2"/>

  <!-- Metadata row -->
  <g transform="translate(128,356)">
    <rect width="1184" height="86" rx="14" fill="#f8fafc" stroke="#e5e9ef"/>
    <rect x="24" y="20" width="78" height="46" rx="23" fill="#e8f2ff"/>
    <text x="63" y="50" text-anchor="middle" class="sans blue" font-size="18" font-weight="700">笔记</text>

    <line x1="132" y1="22" x2="132" y2="64" stroke="#dce2ea" stroke-width="2"/>
    <g transform="translate(158,25)">
      <circle cx="12" cy="18" r="10" fill="none" stroke="#667085" stroke-width="2"/>
      <path d="M12 12v7l4 3" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round"/>
      <text x="34" y="24" class="sans muted" font-size="17">更新于 2026-09-18</text>
    </g>

    <line x1="392" y1="22" x2="392" y2="64" stroke="#dce2ea" stroke-width="2"/>
    <text x="420" y="51" class="sans muted" font-size="16">标签</text>
    <rect x="474" y="20" width="116" height="46" rx="23" fill="#ffffff" stroke="#b9d5f5" stroke-width="2"/>
    <text x="532" y="50" text-anchor="middle" class="sans blue" font-size="17" font-weight="650">JavaScript</text>
    <rect x="602" y="20" width="78" height="46" rx="23" fill="#ffffff" stroke="#b9d5f5" stroke-width="2"/>
    <text x="641" y="50" text-anchor="middle" class="sans blue" font-size="17" font-weight="650">函数</text>

    <line x1="716" y1="22" x2="716" y2="64" stroke="#dce2ea" stroke-width="2"/>
    <rect x="1000" y="14" width="160" height="58" rx="29" fill="#e8f2ff"/>
    <path d="M1030 28h20v30l-10-6-10 6z" fill="#0b72e7"/>
    <text x="1058" y="51" class="sans blue" font-size="17" font-weight="700">已收藏</text>
  </g>

  <text x="128" y="504" class="sans muted" font-size="16">设计说明</text>
  <g class="sans" font-size="19" fill="#344054">
    <text x="128" y="546">• 信息按“类型 → 更新时间 → 标签 → 收藏”分组，阅读路径更清晰。</text>
    <text x="128" y="584">• 标签只承担分类作用，使用轻量描边和主色文字，减少视觉噪音。</text>
    <text x="128" y="622">• 收藏改为右侧独立的圆角操作按钮，不再与元信息挤在同一组里。</text>
    <text x="128" y="660">• 移动端将自动换成两行布局，收藏按钮保持 44px 触控高度。</text>
  </g>
</svg>
