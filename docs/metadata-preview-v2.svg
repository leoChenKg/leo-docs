<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1080" viewBox="0 0 1520 1080">
  <defs>
    <filter id="lightShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1d2939" flood-opacity="0.08"/>
    </filter>
    <filter id="darkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .light-ink { fill: #17202b; }
      .light-muted { fill: #667085; }
      .light-blue { fill: #0877e8; }
      .dark-ink { fill: #f1f5f9; }
      .dark-muted { fill: #9aa7b8; }
      .dark-blue { fill: #66b3ff; }
    </style>
  </defs>

  <!-- Light mode -->
  <rect width="1520" height="1080" fill="#edf1f6"/>
  <rect x="52" y="48" width="1416" height="456" rx="18" fill="#ffffff" stroke="#e3e8ef" filter="url(#lightShadow)"/>
  <text x="104" y="93" class="sans light-muted" font-size="15" font-weight="600" letter-spacing="1.4">LIGHT MODE / ARTICLE META</text>
  <text x="104" y="169" class="sans light-ink" font-size="54" font-weight="760">闭包：让函数记住状态</text>
  <text x="104" y="217" class="sans light-muted" font-size="20">闭包是 JavaScript 中一个非常重要且常见的概念。通过闭包，函数可以记住其创建时的词法作用域。</text>
  <line x1="104" y1="256" x2="1416" y2="256" stroke="#e9edf2" stroke-width="2"/>

  <!-- Light metadata: type -> tags -> bookmark -> time -->
  <g transform="translate(104,286)">
    <rect width="1312" height="78" rx="10" fill="#fbfcfe" stroke="#e2e7ee"/>
    <g transform="translate(24,23)">
      <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h8A2.5 2.5 0 0 1 16 5.5v13l-5.25-3.25L5.5 18.5v-13Z" fill="none" stroke="#0877e8" stroke-width="2" stroke-linejoin="round"/>
      <text x="29" y="18" class="sans light-blue" font-size="17" font-weight="700">笔记</text>
    </g>
    <line x1="132" y1="19" x2="132" y2="59" stroke="#e1e6ed" stroke-width="2"/>
    <text x="160" y="48" class="sans light-muted" font-size="16" font-weight="600">标签</text>
    <text x="215" y="48" class="sans light-blue" font-size="17" font-weight="650">#JavaScript</text>
    <text x="339" y="48" class="sans light-muted" font-size="18">·</text>
    <text x="363" y="48" class="sans light-blue" font-size="17" font-weight="650">#函数</text>
    <line x1="462" y1="19" x2="462" y2="59" stroke="#e1e6ed" stroke-width="2"/>
    <g transform="translate(492,18)">
      <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h8A2.5 2.5 0 0 1 17 5.5v15l-5.25-3.25L6.5 20.5v-15Z" fill="#0877e8"/>
      <text x="30" y="18" class="sans light-blue" font-size="16" font-weight="700">已收藏</text>
    </g>
    <line x1="1000" y1="19" x2="1000" y2="59" stroke="#e1e6ed" stroke-width="2"/>
    <g transform="translate(1031,20)">
      <circle cx="11" cy="18" r="9" fill="none" stroke="#667085" stroke-width="2"/>
      <path d="M11 12v6l4 2.5" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round"/>
      <text x="31" y="23" class="sans light-muted" font-size="16">更新于 2026-09-18</text>
    </g>
  </g>
  <text x="104" y="410" class="sans light-muted" font-size="16">标签不再使用多个厚重边框；更新时间作为最后一项靠右排列，收藏操作保持紧凑。</text>

  <!-- Dark mode -->
  <rect y="540" width="1520" height="540" fill="#0f141a"/>
  <rect x="52" y="588" width="1416" height="456" rx="18" fill="#171d24" stroke="#2a3542" filter="url(#darkShadow)"/>
  <text x="104" y="633" class="sans dark-muted" font-size="15" font-weight="600" letter-spacing="1.4">DARK MODE / ARTICLE META</text>
  <text x="104" y="709" class="sans dark-ink" font-size="54" font-weight="760">闭包：让函数记住状态</text>
  <text x="104" y="757" class="sans dark-muted" font-size="20">闭包是 JavaScript 中一个非常重要且常见的概念。通过闭包，函数可以记住其创建时的词法作用域。</text>
  <line x1="104" y1="796" x2="1416" y2="796" stroke="#2b3643" stroke-width="2"/>
  <g transform="translate(104,826)">
    <rect width="1312" height="78" rx="10" fill="#1c242d" stroke="#303c4b"/>
    <g transform="translate(24,23)">
      <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h8A2.5 2.5 0 0 1 16 5.5v13l-5.25-3.25L5.5 18.5v-13Z" fill="none" stroke="#66b3ff" stroke-width="2" stroke-linejoin="round"/>
      <text x="29" y="18" class="sans dark-blue" font-size="17" font-weight="700">笔记</text>
    </g>
    <line x1="132" y1="19" x2="132" y2="59" stroke="#344252" stroke-width="2"/>
    <text x="160" y="48" class="sans dark-muted" font-size="16" font-weight="600">标签</text>
    <text x="215" y="48" class="sans dark-blue" font-size="17" font-weight="650">#JavaScript</text>
    <text x="339" y="48" class="sans dark-muted" font-size="18">·</text>
    <text x="363" y="48" class="sans dark-blue" font-size="17" font-weight="650">#函数</text>
    <line x1="462" y1="19" x2="462" y2="59" stroke="#344252" stroke-width="2"/>
    <g transform="translate(492,18)">
      <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h8A2.5 2.5 0 0 1 17 5.5v15l-5.25-3.25L6.5 20.5v-15Z" fill="#66b3ff"/>
      <text x="30" y="18" class="sans dark-blue" font-size="16" font-weight="700">已收藏</text>
    </g>
    <line x1="1000" y1="19" x2="1000" y2="59" stroke="#344252" stroke-width="2"/>
    <g transform="translate(1031,20)">
      <circle cx="11" cy="18" r="9" fill="none" stroke="#9aa7b8" stroke-width="2"/>
      <path d="M11 12v6l4 2.5" fill="none" stroke="#9aa7b8" stroke-width="2" stroke-linecap="round"/>
      <text x="31" y="23" class="sans dark-muted" font-size="16">更新于 2026-09-18</text>
    </g>
  </g>
  <text x="104" y="970" class="sans dark-muted" font-size="16">深色模式只调整背景、边框和文字对比度，布局与浅色模式保持一致。</text>
</svg>
