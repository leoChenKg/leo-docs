<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .light-ink { fill: #171d27; }
    .light-muted { fill: #667085; }
    .light-blue { fill: #0877e8; }
    .light-line { stroke: #e4e8ee; }
    .dark-ink { fill: #f1f5f9; }
    .dark-muted { fill: #9aa7b8; }
    .dark-blue { fill: #66b3ff; }
    .dark-line { stroke: #303b49; }
  </style>

  <!-- Light mode -->
  <rect width="1440" height="500" fill="#ffffff"/>
  <text x="96" y="72" class="sans light-muted" font-size="14" font-weight="700" letter-spacing="1.4">LIGHT MODE</text>
  <text x="96" y="148" class="sans light-ink" font-size="58" font-weight="760">闭包：让函数记住状态</text>
  <text x="96" y="204" class="sans light-muted" font-size="22">闭包是 JavaScript 中一个非常重要且常见的概念。通过闭包，函数可以记住其创建时的词法作用域。</text>
  <line x1="96" y1="245" x2="1344" y2="245" class="light-line" stroke-width="2"/>

  <!-- No enclosing box: original inline metadata row -->
  <g transform="translate(96,278)">
    <rect x="0" y="-23" width="66" height="36" rx="18" fill="#eef2f6"/>
    <text x="33" y="1" text-anchor="middle" class="sans light-ink" font-size="16" font-weight="650">note</text>
    <line x1="88" y1="-17" x2="88" y2="15" class="light-line" stroke-width="2"/>
    <text x="112" y="1" class="sans light-blue" font-size="17" font-weight="650">#JavaScript</text>
    <text x="236" y="1" class="sans light-muted" font-size="18">·</text>
    <text x="260" y="1" class="sans light-blue" font-size="17" font-weight="650">#函数</text>
    <line x1="350" y1="-17" x2="350" y2="15" class="light-line" stroke-width="2"/>
    <path d="M375 -13h17v28l-8.5-5-8.5 5z" fill="#0877e8"/>
    <text x="405" y="1" class="sans light-blue" font-size="16" font-weight="700">已收藏</text>
    <line x1="516" y1="-17" x2="516" y2="15" class="light-line" stroke-width="2"/>
    <circle cx="541" cy="-1" r="9" fill="none" stroke="#667085" stroke-width="2"/>
    <path d="M541 -7v6l4 2.5" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round"/>
    <text x="562" y="5" class="sans light-muted" font-size="16">更新于 2026-09-18</text>
  </g>
  <text x="96" y="360" class="sans light-muted" font-size="16">信息保持一行展示，不增加外框；时间作为最后一项放在收藏操作之后。</text>

  <!-- Dark mode -->
  <rect y="500" width="1440" height="500" fill="#10151b"/>
  <text x="96" y="572" class="sans dark-muted" font-size="14" font-weight="700" letter-spacing="1.4">DARK MODE</text>
  <text x="96" y="648" class="sans dark-ink" font-size="58" font-weight="760">闭包：让函数记住状态</text>
  <text x="96" y="704" class="sans dark-muted" font-size="22">闭包是 JavaScript 中一个非常重要且常见的概念。通过闭包，函数可以记住其创建时的词法作用域。</text>
  <line x1="96" y1="745" x2="1344" y2="745" class="dark-line" stroke-width="2"/>
  <g transform="translate(96,778)">
    <rect x="0" y="-23" width="66" height="36" rx="18" fill="#26313d"/>
    <text x="33" y="1" text-anchor="middle" class="sans dark-ink" font-size="16" font-weight="650">note</text>
    <line x1="88" y1="-17" x2="88" y2="15" class="dark-line" stroke-width="2"/>
    <text x="112" y="1" class="sans dark-blue" font-size="17" font-weight="650">#JavaScript</text>
    <text x="236" y="1" class="sans dark-muted" font-size="18">·</text>
    <text x="260" y="1" class="sans dark-blue" font-size="17" font-weight="650">#函数</text>
    <line x1="350" y1="-17" x2="350" y2="15" class="dark-line" stroke-width="2"/>
    <path d="M375 -13h17v28l-8.5-5-8.5 5z" fill="#66b3ff"/>
    <text x="405" y="1" class="sans dark-blue" font-size="16" font-weight="700">已收藏</text>
    <line x1="516" y1="-17" x2="516" y2="15" class="dark-line" stroke-width="2"/>
    <circle cx="541" cy="-1" r="9" fill="none" stroke="#9aa7b8" stroke-width="2"/>
    <path d="M541 -7v6l4 2.5" fill="none" stroke="#9aa7b8" stroke-width="2" stroke-linecap="round"/>
    <text x="562" y="5" class="sans dark-muted" font-size="16">更新于 2026-09-18</text>
  </g>
  <text x="96" y="860" class="sans dark-muted" font-size="16">深色模式只调整颜色对比度，保持同一行内结构。</text>
</svg>
