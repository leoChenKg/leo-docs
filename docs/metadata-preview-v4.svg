<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .light-ink { fill: #171d27; }
    .light-muted { fill: #667085; }
    .light-blue { fill: #0877e8; }
    .light-border { stroke: #c9d0da; }
    .dark-ink { fill: #f1f5f9; }
    .dark-muted { fill: #a6b1c0; }
    .dark-blue { fill: #66b3ff; }
    .dark-border { stroke: #526071; }
  </style>

  <!-- Light mode -->
  <rect width="1440" height="500" fill="#ffffff"/>
  <text x="96" y="70" class="sans light-muted" font-size="14" font-weight="700" letter-spacing="1.4">LIGHT MODE</text>
  <text x="96" y="146" class="sans light-ink" font-size="58" font-weight="760">闭包：让函数记住状态</text>
  <text x="96" y="202" class="sans light-muted" font-size="22">闭包是 JavaScript 中一个非常重要且常见的概念。通过闭包，函数可以记住其创建时的词法作用域。</text>
  <line x1="96" y1="244" x2="1344" y2="244" stroke="#e4e8ee" stroke-width="2"/>

  <!-- MUI outlined items, no enclosing frame -->
  <g transform="translate(96,278)">
    <rect x="0" y="-22" width="126" height="42" rx="21" fill="#ffffff" class="light-border" stroke-width="1.5"/>
    <path d="M18 -10h16v24l-8-4.5-8 4.5z" fill="none" stroke="#667085" stroke-width="2" stroke-linejoin="round"/>
    <text x="46" y="5" class="sans light-ink" font-size="16" font-weight="650">笔记</text>

    <rect x="138" y="-22" width="156" height="42" rx="21" fill="#ffffff" class="light-border" stroke-width="1.5"/>
    <text x="160" y="5" class="sans light-blue" font-size="16" font-weight="650"># JavaScript</text>

    <rect x="306" y="-22" width="94" height="42" rx="21" fill="#ffffff" class="light-border" stroke-width="1.5"/>
    <text x="328" y="5" class="sans light-blue" font-size="16" font-weight="650"># 函数</text>

    <rect x="412" y="-22" width="126" height="42" rx="21" fill="#ffffff" class="light-border" stroke-width="1.5"/>
    <path d="M432 -10h16v24l-8-4.5-8 4.5z" fill="#0877e8"/>
    <text x="460" y="5" class="sans light-blue" font-size="16" font-weight="700">已收藏</text>

    <rect x="550" y="-22" width="214" height="42" rx="21" fill="#ffffff" class="light-border" stroke-width="1.5"/>
    <circle cx="575" cy="-1" r="9" fill="none" stroke="#667085" stroke-width="2"/>
    <path d="M575 -7v6l4 2.5" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round"/>
    <text x="596" y="5" class="sans light-muted" font-size="16">更新于 2026-09-18</text>
  </g>
  <text x="96" y="356" class="sans light-muted" font-size="16">每项独立使用 MUI outlined 风格，统一高度和圆角；整体不增加外框。</text>

  <!-- Dark mode -->
  <rect y="500" width="1440" height="500" fill="#10151b"/>
  <text x="96" y="570" class="sans dark-muted" font-size="14" font-weight="700" letter-spacing="1.4">DARK MODE</text>
  <text x="96" y="646" class="sans dark-ink" font-size="58" font-weight="760">闭包：让函数记住状态</text>
  <text x="96" y="702" class="sans dark-muted" font-size="22">闭包是 JavaScript 中一个非常重要且常见的概念。通过闭包，函数可以记住其创建时的词法作用域。</text>
  <line x1="96" y1="744" x2="1344" y2="744" stroke="#303b49" stroke-width="2"/>
  <g transform="translate(96,778)">
    <rect x="0" y="-22" width="126" height="42" rx="21" fill="#10151b" class="dark-border" stroke-width="1.5"/>
    <path d="M18 -10h16v24l-8-4.5-8 4.5z" fill="none" stroke="#a6b1c0" stroke-width="2" stroke-linejoin="round"/>
    <text x="46" y="5" class="sans dark-ink" font-size="16" font-weight="650">笔记</text>
    <rect x="138" y="-22" width="156" height="42" rx="21" fill="#10151b" class="dark-border" stroke-width="1.5"/>
    <text x="160" y="5" class="sans dark-blue" font-size="16" font-weight="650"># JavaScript</text>
    <rect x="306" y="-22" width="94" height="42" rx="21" fill="#10151b" class="dark-border" stroke-width="1.5"/>
    <text x="328" y="5" class="sans dark-blue" font-size="16" font-weight="650"># 函数</text>
    <rect x="412" y="-22" width="126" height="42" rx="21" fill="#10151b" class="dark-border" stroke-width="1.5"/>
    <path d="M432 -10h16v24l-8-4.5-8 4.5z" fill="#66b3ff"/>
    <text x="460" y="5" class="sans dark-blue" font-size="16" font-weight="700">已收藏</text>
    <rect x="550" y="-22" width="214" height="42" rx="21" fill="#10151b" class="dark-border" stroke-width="1.5"/>
    <circle cx="575" cy="-1" r="9" fill="none" stroke="#a6b1c0" stroke-width="2"/>
    <path d="M575 -7v6l4 2.5" fill="none" stroke="#a6b1c0" stroke-width="2" stroke-linecap="round"/>
    <text x="596" y="5" class="sans dark-muted" font-size="16">更新于 2026-09-18</text>
  </g>
  <text x="96" y="856" class="sans dark-muted" font-size="16">深色模式沿用相同的 outlined 结构，只调整背景、边框和文字对比度。</text>
</svg>
