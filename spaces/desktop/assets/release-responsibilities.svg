<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740" role="img" aria-labelledby="title desc">
  <title id="title">桌面端交付主线：从构建到用户更新</title>
  <desc id="desc">人工在 Downton 发起构建，Jenkins 在构建机执行，AppHub 保存结果。测试回测后回到 Downton 转存发布文件并对 Windows 送审，再到 Mars 配置升级、回测与放量。客户端查询版本服务后按规则更新。Mac 公证和热更新有独立 Jenkins 任务。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6c80"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18283c}
      .heading{font-size:30px;font-weight:650}.sub{font-size:18px;fill:#52637a}.label{font-size:23px;font-weight:600}.body{font-size:19px}.small{font-size:17px;fill:#43546b}.arrow{fill:none;stroke:#5c6c80;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1080" height="740" rx="18" fill="#f6f8fc"/>
  <text x="40" y="52" class="heading">从构建到用户更新</text>
  <text x="40" y="83" class="sub">代码 → 安装包 → 测试回测 → 发布配置 → 用户升级</text>
  <rect x="40" y="128" width="290" height="158" rx="12" fill="#e8effb"/>
  <text x="62" y="164" class="label">01  Downton</text>
  <text x="62" y="201" class="body">人工选择分支、角色、架构</text>
  <text x="62" y="233" class="body">触发参数化构建请求</text>
  <text x="62" y="263" class="small">受理请求 ≠ 构建完成</text>
  <path d="M330 207 H391" class="arrow"/>
  <rect x="395" y="128" width="290" height="158" rx="12" fill="#e8effb"/>
  <text x="417" y="164" class="label">02  Jenkins ＋ Agent</text>
  <text x="417" y="201" class="body">检出代码、编译、打包</text>
  <text x="417" y="233" class="body">执行签名与上传相关脚本</text>
  <text x="417" y="263" class="small">也可能命中已有包并复用</text>
  <path d="M685 207 H746" class="arrow"/>
  <rect x="750" y="128" width="290" height="158" rx="12" fill="#e8effb"/>
  <text x="772" y="164" class="label">03  AppHub</text>
  <text x="772" y="201" class="body">记录 Commit、版本、构建号</text>
  <text x="772" y="233" class="body">提供 OSS 制品下载地址</text>
  <text x="772" y="263" class="small">Online 包 ≠ 已向用户发布</text>
  <path d="M895 286 V390" class="arrow"/>
  <rect x="771" y="314" width="248" height="46" rx="8" fill="#ffebcc"/>
  <text x="895" y="344" text-anchor="middle" class="body">人工关口：测试回测</text>
  <rect x="750" y="395" width="290" height="158" rx="12" fill="#e5f3ee"/>
  <text x="772" y="431" class="label">04  Downton</text>
  <text x="772" y="468" class="body">核对制品、转存发布文件</text>
  <text x="772" y="500" class="body">Windows 送审、发版记录</text>
  <text x="772" y="530" class="small">记录存在 ≠ 外部审核通过</text>
  <path d="M750 474 H689" class="arrow"/>
  <rect x="395" y="395" width="290" height="158" rx="12" fill="#e5f3ee"/>
  <text x="417" y="431" class="label">05  Mars</text>
  <text x="417" y="468" class="body">配置完整包／热更新地址</text>
  <text x="417" y="500" class="body">回测后调整灰度、全量</text>
  <text x="417" y="530" class="small">人工操作 → 发布管理后端</text>
  <path d="M395 474 H334" class="arrow"/>
  <rect x="40" y="395" width="290" height="158" rx="12" fill="#e5f3ee"/>
  <text x="62" y="431" class="label">06  客户端</text>
  <text x="62" y="468" class="body">查询版本服务，判断升级</text>
  <text x="62" y="500" class="body">从文件服务下载适用产物</text>
  <text x="62" y="530" class="small">不读取 Mars 网页或 Jenkins</text>
  <rect x="40" y="593" width="1000" height="64" rx="10" fill="#fff0d9"/>
  <text x="62" y="619" class="body">独立任务：Mac 正式包公证 ｜ 旧包＋新包 → 热更新 ZIP</text>
  <text x="62" y="644" class="small">主打包任务 SUCCESS，不能代替这些任务及人工发布关口的验收。</text>
  <text x="40" y="700" class="sub">箭头表示工作衔接；测试、审核确认、灰度和全量需要人工推进。</text>
</svg>
